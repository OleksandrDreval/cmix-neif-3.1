<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1118" width="960" height="1118" role="img" aria-labelledby="t d">
<title id="t">SEMCACHE at one byte of the page Brown Bear</title>
<desc id="d">SEMCACHE at stream byte 54,868,329 of the coder stream, on the page Brown Bear. The excerpt of the stream with the coded byte (goat), the top 3 of the transformer alone and of SEMCACHE alone, the cost of the byte for the transformer alone, SEMCACHE alone and the whole compressor, and the five strongest neighbours with their earlier place in the stream.</desc>
<rect x="0.5" y="0.5" width="959" height="1117" rx="6" fill="#fcfcfb" stroke="#d9d8d1"/>
<text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#0b0b0b" font-weight="600">SEMCACHE at one byte of the page Brown Bear</text>
<text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Stream byte 54,868,329 (10.95 % of the coder stream), in the article text. Values from a compression run of this</text>
<text x="24" y="70" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">version with a probe that only reads; up to this point of the stream its coded output is identical byte for byte to</text>
<text x="24" y="86" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">that in the submitted archive9.</text>
<text x="24" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The place in the stream</text>
<rect x="24" y="124" width="912" height="56" fill="#ffffff" rx="4" stroke="#d9d8d1"/>
<rect x="614.6" y="134.5" width="29.6" height="15.5" fill="#e3f2e3" rx="2" stroke="#008300" stroke-width="1"/>
<text x="36" y="146" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0b0b0b" textLength="869.4" lengthAdjust="spacing">&#8230; of the problem lies with [shepherd]s; over the past two centuries, many sheep and goat herders have gradually abandoned the&#8230;</text>
<text x="36" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">The byte coded here is the last of the three bytes of the word code of goat; the first two are already coded.</text>
<text x="24" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">Transformer alone, top 3</text>
<text x="24" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">its distribution of this byte</text>
<text x="24" y="250" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a56f00" font-weight="600">goats</text>
<rect x="124" y="240" width="122.76" height="12" fill="#5598e7"/>
<text x="252.76" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">56 %</text>
<text x="24" y="272" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#52514e">pigs</text>
<rect x="124" y="262" width="17.62" height="12" fill="#5598e7"/>
<text x="147.622" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">8 %</text>
<text x="24" y="294" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#52514e">deer</text>
<rect x="124" y="284" width="9.92" height="12" fill="#5598e7"/>
<text x="139.922" y="294" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">5 %</text>
<text x="492" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">SEMCACHE alone, top 3</text>
<text x="492" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">from 39 neighbours at 36 positions, highest cosine 0.969</text>
<text x="492" y="250" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a56f00" font-weight="600">goats</text>
<rect x="592" y="240" width="83.12" height="12" fill="#0e7c86"/>
<text x="681.116" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">38 %</text>
<text x="492" y="272" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#008300" font-weight="600">goat</text>
<rect x="592" y="262" width="43.89" height="12" fill="#0e7c86"/>
<text x="641.89" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">20 %</text>
<text x="492" y="294" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#52514e">sheep</text>
<rect x="592" y="284" width="37.71" height="12" fill="#0e7c86"/>
<text x="635.708" y="294" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">17 %</text>
<rect x="24" y="310" width="12" height="12" fill="#e3f2e3" rx="2" stroke="#008300" stroke-width="1"/>
<text x="42" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#008300">the true word</text>
<rect x="147.2" y="310" width="12" height="12" fill="#fbefd6" rx="2" stroke="#a56f00" stroke-width="1"/>
<text x="165.2" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a56f00">the true word in another form</text>
<rect x="372.8" y="310" width="12" height="12" fill="#f3f2ee" rx="2" stroke="#b5b4aa" stroke-width="1"/>
<text x="390.8" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">another word</text>
<text x="936" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end">goat is not among the top 3 of the transformer</text>
<rect x="24" y="338" width="3" height="50" fill="#a56f00"/>
<text x="36" y="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">goat and goats share the first two of the three bytes of their word code. A neighbour followed by goats agrees with the true</text>
<text x="36" y="366" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">word up to this byte, and only this last byte, singular or plural, differs. Lynx and Moose were already neighbours at the lookup</text>
<text x="36" y="382" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">on the first byte of the code and were followed from there, as the bytes behind them agreed with the stream.</text>
<text x="24" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Cost of the coded byte</tspan><tspan font-size="12" fill="#52514e" dx="10">in bits, lower is better</tspan></text>
<text x="24" y="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">transformer alone</text>
<rect x="170" y="433" width="358.08" height="14" fill="#5598e7"/>
<text x="534.08" y="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">5.97 bit</text>
<text x="24" y="466" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">SEMCACHE alone</text>
<rect x="170" y="455" width="150.9" height="14" fill="#0e7c86"/>
<text x="326.9" y="466" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">2.52 bit</text>
<text x="24" y="488" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">whole compressor</text>
<rect x="170" y="477" width="239.7" height="14" fill="#52514e"/>
<text x="415.7" y="488" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">4.00 bit</text>
<line x1="170" y1="502" x2="650" y2="502" stroke="#b5b4aa" stroke-width="1"/>
<line x1="170" y1="502" x2="170" y2="506" stroke="#b5b4aa" stroke-width="1"/>
<text x="170" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">0</text>
<line x1="290" y1="502" x2="290" y2="506" stroke="#b5b4aa" stroke-width="1"/>
<text x="290" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">2</text>
<line x1="410" y1="502" x2="410" y2="506" stroke="#b5b4aa" stroke-width="1"/>
<text x="410" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">4</text>
<line x1="530" y1="502" x2="530" y2="506" stroke="#b5b4aa" stroke-width="1"/>
<text x="530" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">6</text>
<line x1="650" y1="502" x2="650" y2="506" stroke="#b5b4aa" stroke-width="1"/>
<text x="650" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">8 bit</text>
<text x="24" y="540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">The whole compressor mixes the transformer with all its other models (PPMd, match and context models), and BITLSTM corrects the</text>
<text x="24" y="556" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">mix. SEMCACHE enters as an input of the mixers, as four inputs of BITLSTM and through the end stage, so the distance of the</text>
<text x="24" y="572" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">whole compressor to the transformer alone comes from all models together and cannot be read as the gain of SEMCACHE. Of these</text>
<text x="24" y="588" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">three paths only the end stage was measured on its own, with 3.83 bit in front of it and 3.89 bit behind it (+0.06 bit); the</text>
<text x="24" y="604" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">top-1 stage behind it, which reads nothing of SEMCACHE, gives the 4.00 bit.</text>
<text x="24" y="646" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">The five strongest neighbours and their earlier place in the stream</text>
<circle cx="32" cy="668" r="8" fill="#0e7c86"/>
<text x="32" y="672" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="48" y="672" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Lynx</tspan><tspan fill="#52514e">, other article, 0.45 MB back, cosine 0.969, weight 0.17</tspan></text>
<text x="48" y="688" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a56f00" font-weight="600">followed by goats, the true word in another form (plural)</text>
<rect x="48" y="696" width="888" height="24" fill="#ffffff" rx="4" stroke="#d9d8d1"/>
<rect x="615.9" y="700.5" width="36.5" height="15.5" fill="#fbefd6" rx="2" stroke="#a56f00" stroke-width="1"/>
<text x="58" y="712" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0b0b0b" textLength="600.3" lengthAdjust="spacing">&#8230; 2 to 4 kittens at a time. It feeds on birds and mammals and often on sheep and goats.</text>
<circle cx="32" cy="738" r="8" fill="#0e7c86"/>
<text x="32" y="742" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="48" y="742" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Livestock</tspan><tspan fill="#52514e">, other article, 0.53 MB back, cosine 0.918, weight 0.10</tspan></text>
<text x="48" y="758" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">followed by sheep, another word</text>
<rect x="48" y="766" width="888" height="24" fill="#ffffff" rx="4" stroke="#d9d8d1"/>
<rect x="595.2" y="770.5" width="36.5" height="15.5" fill="#f3f2ee" rx="2" stroke="#b5b4aa" stroke-width="1"/>
<text x="58" y="782" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0b0b0b" textLength="655.5" lengthAdjust="spacing">&#8230; weeds and undergrowth. For example, in areas prone to wild fires, goats and sheep are set to&#8230;</text>
<circle cx="32" cy="808" r="8" fill="#0e7c86"/>
<text x="32" y="812" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="48" y="812" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Moose</tspan><tspan fill="#52514e">, other article, 0.24 MB back, cosine 0.923, weight 0.07</tspan></text>
<text x="48" y="828" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a56f00" font-weight="600">followed by goats, the true word in another form (plural)</text>
<rect x="48" y="836" width="888" height="24" fill="#ffffff" rx="4" stroke="#d9d8d1"/>
<rect x="609" y="840.5" width="36.5" height="15.5" fill="#fbefd6" rx="2" stroke="#a56f00" stroke-width="1"/>
<text x="58" y="852" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0b0b0b" textLength="655.5" lengthAdjust="spacing">&#8230; Their [teeth] resemble those of other ruminants such as deer, cows, sheep and goats. On each&#8230;</text>
<circle cx="32" cy="878" r="8" fill="#0e7c86"/>
<text x="32" y="882" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
<text x="48" y="882" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Ungulate</tspan><tspan fill="#52514e">, other article, 0.10 MB back, cosine 0.957, weight 0.05</tspan></text>
<text x="48" y="898" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#008300" font-weight="600">followed by goat, the true word</text>
<rect x="48" y="906" width="888" height="24" fill="#ffffff" rx="4" stroke="#d9d8d1"/>
<rect x="519.3" y="910.5" width="29.6" height="15.5" fill="#e3f2e3" rx="2" stroke="#008300" stroke-width="1"/>
<text x="58" y="922" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0b0b0b" textLength="552" lengthAdjust="spacing">* [Artiodactyla]: even-toed ungulates, such as [cattle], [sheep], [goat|goats],&#8230;</text>
<circle cx="32" cy="948" r="8" fill="#0e7c86"/>
<text x="32" y="952" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">5</text>
<text x="48" y="952" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Animal rights</tspan><tspan fill="#52514e">, other article, 0.80 MB back, cosine 0.957, weight 0.05</tspan></text>
<text x="48" y="968" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">followed by chickens, another word</text>
<rect x="48" y="976" width="888" height="24" fill="#ffffff" rx="4" stroke="#d9d8d1"/>
<rect x="609" y="980.5" width="57.2" height="15.5" fill="#f3f2ee" rx="2" stroke="#b5b4aa" stroke-width="1"/>
<text x="58" y="992" font-family="ui-monospace, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#0b0b0b" textLength="676.2" lengthAdjust="spacing">&#8230; hundreds of miles of plant life...but Man must not. Cougars may eat sheep and chickens, but Man&#8230;</text>
<text x="24" y="1022" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">The other neighbours carry the remaining 0.56 of the weight.</text>
<text x="24" y="1048" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69">Excerpts are text of the coder stream with the dictionary codes written out as words; a link stands in single brackets there. A candidate</text>
<text x="24" y="1063" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69">byte that completes a word code is shown as that word. Weight is the share of a neighbour in the total weight of all neighbours. The cost of</text>
<text x="24" y="1078" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69">SEMCACHE alone comes from its probability bit by bit, with a small smoothing in each bit, so it is a little higher than its share of the</text>
<text x="24" y="1093" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69">byte would give.</text>
</svg>
