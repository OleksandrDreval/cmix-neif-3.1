<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" width="960" height="770" role="img" aria-labelledby="t d">
<title id="t">SEMCACHE</title>
<desc id="d">Data flow of SEMCACHE: a key from the state of the transformer, stored with the byte that followed; a lookup finds the nearest earlier keys and turns the bytes that followed them into a prediction, which reaches the mixers, the BITLSTM and an end stage in front of the coder.</desc>
<rect x="0.5" y="0.5" width="959" height="769" rx="6" fill="#fcfcfb" stroke="#d9d8d1"/>
<text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#0b0b0b" font-weight="600">SEMCACHE: a memory of transformer states</text>
<text x="24" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Built only from bytes already coded, the same way in the decoder. Nothing of it is stored in the archive.</text>
<rect x="24" y="80" width="282" height="70" fill="#f3f2ee" rx="6" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="34" y="99" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">transformer, last layer</text>
<text x="34" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">192 values: the input of the MLP of layer 16,</text>
<text x="34" y="131" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">a learned mix of all earlier sublayer outputs</text>
<rect x="24" y="176" width="282" height="86" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="34" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">key of the byte</text>
<text x="34" y="212" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">minus a running mean (fixed after 2^20</text>
<text x="34" y="227" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">lookups), int8, random +-1 projection 192 to</text>
<text x="34" y="242" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">128, int8; stored as 128 int4 values (64 B)</text>
<rect x="24" y="288" width="282" height="86" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="34" y="307" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">which bytes</text>
<text x="34" y="324" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">bytes the transformer predicts, by p(top-1):</text>
<text x="34" y="339" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">look up below 0.99, store below 0.95,</text>
<text x="34" y="354" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">start followers below 0.90</text>
<line x1="165" y1="150" x2="165" y2="167" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M165 175 L161 167 L169 167 z" fill="#0e7c86"/>
<line x1="165" y1="262" x2="165" y2="279" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M165 287 L161 279 L169 279 z" fill="#0e7c86"/>
<text x="686" y="99" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="1" fill="#0b0b0b"></text>
<rect x="676" y="80" width="260" height="314" fill="#ffffff" rx="6" stroke="#0e7c86" stroke-width="1.6"/>
<text x="686" y="99" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">memory</tspan><tspan fill="#52514e" dx="8">2,096 MiB, about 2.2 GB</tspan></text>
<rect x="684" y="114" width="244" height="52" fill="#dff0f1" rx="4"/>
<text x="692" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">key ring</text>
<text x="692" y="145" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">2^24 entries (16.8 million), the newest</text>
<text x="692" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">keys: 1,024 MiB</text>
<rect x="684" y="174" width="244" height="52" fill="#dff0f1" rx="4"/>
<text x="692" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">per entry</text>
<text x="692" y="205" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">the byte that followed: 16 MiB</text>
<text x="692" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">its stream position: 64 MiB</text>
<rect x="684" y="234" width="244" height="37" fill="#dff0f1" rx="4"/>
<text x="692" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">stream history</text>
<text x="692" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">the last 2^25 bytes: 32 MiB</text>
<rect x="684" y="279" width="244" height="67" fill="#dff0f1" rx="4"/>
<text x="692" y="295" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">bucket tables</text>
<text x="692" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">16 SimHash tables x 2^18 buckets x 15</text>
<text x="692" y="325" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">slots: entry number + 96-bit sketch</text>
<text x="692" y="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">of the key: 960 MiB</text>
<text x="686" y="364" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">A stored entry replaces the oldest</text>
<text x="686" y="379" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">slot of its bucket in each table.</text>
<rect x="352" y="80" width="290" height="86" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="362" y="99" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">candidates</text>
<text x="362" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">per table its bucket and 3 buckets of the least</text>
<text x="362" y="131" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">certain hash bits; hash moved by the previous</text>
<text x="362" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">byte; entries at least 1,024 bytes back</text>
<rect x="352" y="188" width="290" height="54" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="362" y="207" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">sketch filter</text>
<text x="362" y="224" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">closest 128 by Hamming distance of the sketch</text>
<rect x="352" y="264" width="290" height="54" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="362" y="283" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">nearest neighbours</text>
<text x="362" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">32 by the cosine of the int4 keys</text>
<line x1="497" y1="166" x2="497" y2="179" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M497 187 L493 179 L501 179 z" fill="#0e7c86"/>
<line x1="497" y1="242" x2="497" y2="255" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M497 263 L493 255 L501 255 z" fill="#0e7c86"/>
<path d="M306 310 L328 310 L328 110 L343 110" fill="none" stroke="#0e7c86" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M351 110 L343 114 L343 106 z" fill="#0e7c86"/>
<text x="322" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0e7c86" text-anchor="middle" font-weight="600" transform="rotate(-90 322 210)">look up</text>
<line x1="676" y1="110" x2="651" y2="110" stroke="#8cc9cf" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M643 110 l8 -4 v8 z" fill="#8cc9cf"/>
<text x="659" y="105" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">slots</text>
<line x1="676" y1="294" x2="651" y2="294" stroke="#8cc9cf" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M643 294 l8 -4 v8 z" fill="#8cc9cf"/>
<text x="659" y="289" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#6f6e69" text-anchor="middle">keys</text>
<path d="M84 374 L84 414 L902 414 L902 403" fill="none" stroke="#0e7c86" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M902 395 L906 403 L898 403 z" fill="#0e7c86"/>
<text x="489" y="408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0e7c86" text-anchor="end" font-weight="600">store: the key and the byte that followed</text>
<rect x="24" y="438" width="282" height="70" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="34" y="457" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">followers</text>
<text x="34" y="474" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">the neighbours of the last 4 lookups below</text>
<text x="34" y="489" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">0.90, followed byte by byte for up to 24 bytes</text>
<text x="34" y="504" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">while their continuation matches the stream</text>
<rect x="352" y="438" width="584" height="70" fill="#dff0f1" rx="6" stroke="#0e7c86" stroke-width="1.2"/>
<text x="362" y="457" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" font-weight="600">prediction</text>
<text x="362" y="474" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">each neighbour votes for the byte that followed it, weight exp((s - s_max) / 0.02)</text>
<text x="362" y="489" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">on its cosine s; per bit only neighbours whose byte agrees with the bits coded so far;</text>
<text x="362" y="504" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">out: log-odds, agreeing weight, best cosine, top byte = transformer top-1 or not</text>
<line x1="306" y1="473" x2="343" y2="473" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M351 473 L343 477 L343 469 z" fill="#0e7c86"/>
<line x1="497" y1="318" x2="497" y2="429" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M497 437 l-4 -8 h8 z" fill="#0e7c86"/>
<line x1="24" y1="538" x2="936" y2="538" stroke="#e1e0d9" stroke-width="1"/>
<rect x="24" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="68.44" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">models</text>
<rect x="126.89" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="171.33" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">layer-0 mixers</text>
<line x1="113.89" y1="622" x2="117.89" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M125.89 622 L117.89 626 L117.89 618 z" fill="#6f6e69"/>
<rect x="229.78" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="274.22" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">final mixer</text>
<line x1="216.78" y1="622" x2="220.78" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M228.78 622 L220.78 626 L220.78 618 z" fill="#6f6e69"/>
<rect x="332.67" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="377.11" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">SSE</text>
<line x1="319.67" y1="622" x2="323.67" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M331.67 622 L323.67 626 L323.67 618 z" fill="#6f6e69"/>
<rect x="435.56" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="480" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">BITLSTM</text>
<line x1="422.56" y1="622" x2="426.56" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M434.56 622 L426.56 626 L426.56 618 z" fill="#6f6e69"/>
<rect x="538.44" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="582.89" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">floor stage</text>
<line x1="525.44" y1="622" x2="529.44" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M537.44 622 L529.44 626 L529.44 618 z" fill="#6f6e69"/>
<rect x="641.33" y="600" width="88.89" height="44" fill="#dff0f1" rx="5" stroke="#0e7c86" stroke-width="1.2"/>
<text x="685.78" y="619" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">SEMCACHE</text>
<text x="685.78" y="634" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="middle">end stage</text>
<line x1="628.33" y1="622" x2="632.33" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M640.33 622 L632.33 626 L632.33 618 z" fill="#6f6e69"/>
<rect x="744.22" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="788.67" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">top-1 stage</text>
<line x1="731.22" y1="622" x2="735.22" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M743.22 622 L735.22 626 L735.22 618 z" fill="#6f6e69"/>
<rect x="847.11" y="600" width="88.89" height="44" fill="#f3f2ee" rx="5" stroke="#b5b4aa" stroke-width="1.2"/>
<text x="891.56" y="627" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="600">coder</text>
<line x1="834.11" y1="622" x2="838.11" y2="622" stroke="#6f6e69" stroke-width="1.2"/>
<path d="M846.11 622 L838.11 626 L838.11 618 z" fill="#6f6e69"/>
<text x="24" y="560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600">Where the prediction enters the coding chain of each bit</tspan></text>
<line x1="412" y1="508" x2="412" y2="578" stroke="#0e7c86" stroke-width="1.4"/>
<line x1="171.33" y1="578" x2="685.78" y2="578" stroke="#0e7c86" stroke-width="1.4"/>
<line x1="171.33" y1="578" x2="171.33" y2="591" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M171.33 599 l-4 -8 h8 z" fill="#0e7c86"/>
<text x="176.33" y="594" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7c86" font-weight="600">1 input</text>
<line x1="274.22" y1="578" x2="274.22" y2="591" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M274.22 599 l-4 -8 h8 z" fill="#0e7c86"/>
<text x="279.22" y="594" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7c86" font-weight="600">1 column</text>
<line x1="480" y1="578" x2="480" y2="591" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M480 599 l-4 -8 h8 z" fill="#0e7c86"/>
<text x="485" y="594" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7c86" font-weight="600">4 inputs</text>
<line x1="685.78" y1="578" x2="685.78" y2="591" stroke="#0e7c86" stroke-width="1.4"/>
<path d="M685.78 599 l-4 -8 h8 z" fill="#0e7c86"/>
<text x="690.78" y="594" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0e7c86" font-weight="600">20 features</text>
<text x="24" y="666" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">End stage: three logistic stages over 20 features in context cells (similarity, agreement, word start, age,</text>
<text x="24" y="681" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">previous byte), AdaGrad, mixed per bit position. A bit already predicted with P >= 0.99 passes unchanged.</text>
<text x="24" y="696" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">The top-1 stage behind it reads no SEMCACHE data. An entry is stored once its byte is coded.</text>
<rect x="24" y="710" width="912" height="44" fill="#ffffff" rx="6" stroke="#d9d8d1" stroke-width="1"/>
<text x="36" y="728" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b"><tspan font-weight="600">Effect</tspan><tspan dx="8">paired full runs with and without SEMCACHE, same transformer:</tspan> coded output -743,637 B over the whole stream,</text>
<text x="36" y="744" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b">about -730 KB of S with its code. Memory about 2.2 GB, made resident at the first byte, with room made in the PPMd pool.</text>
</svg>
