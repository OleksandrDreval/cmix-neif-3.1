<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="t d">
<title id="t">Layout of the coder stream</title>
<desc id="d">The 2.0 coder stream to scale against the 1.0 stream: metadata block, census metadata block, text start with dictionary, contributor and census pseudo article, redirect block, articles with the calendar block, census pages, image, Wikipedia: and disambiguation pages; bands for the three BITLSTM weight sets and for the transformer and SEMCACHE; enlarged views of the first 4.1 % and the last 3.2 %.</desc>
